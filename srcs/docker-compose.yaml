services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx
    image: nginx:latest
    ports:
      - 443:443
    volumes:
      - wordpress:/var/www/html:ro
    restart: always
    depends_on:
      - wordpress
    networks:
      - oiia-network
    env_file:
      - .env
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress:latest
    depends_on:
      - mariadb
    restart: always
    env_file:
      - .env
    networks:
      - oiia-network
    volumes:
      - wordpress:/var/www/html
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb:latest
    env_file:
      - .env
    volumes:
      - mariadb:/var/lib/mysql
    restart: always
    networks:
      - oiia-network

# Declarations
volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      device: /home/gwen/data/wordpress
      o: bind
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: /home/gwen/data/mariadb
      o: bind

# By default, the network's driver is "bridge"
# Other drivers are: "host", "none", "overlay", "ipvlan" and "macvlan"
networks:
  oiia-network:
    driver: bridge