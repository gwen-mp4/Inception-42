http {
    # Optimisation SSL (reduces CPU loads)
    ssl_session_cache shared:SSL:10m; # Allocates 10Mo of RAM for cache
    ssl_session_timeout 10m; # 10 minutes before doing handshake again

    server {
        listen 443 ssl; # IPv4 with SSL/TLS (https)
        listen [::]:443 ssl; # IPv6

        server_name gwen.42.fr;

        # Give the web 70sec to download everything instead of one connection per file
        keepalive_timeout 70s;

        # Generate SSL/TLS certificate and key
        ssl_certificate /etc/nginx/ssl/gwen.crt;
        ssl_certificate_key /etc/nginx/ssl/gwen.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # It's where all the files (HTML pages, PHP files...) of the website are
        root /var/www/wordpress;

        # If user don't specify a name, return these by default
        index index.php index.html index.htm;

        location / {
            # Try to find the file, if not, redirect to 
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Transfer PHP files to PHP-FPM
        # (FastCGI/translating PHP files because NGINX don't understand it)
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_pass wordpress:9000; # Port 9000 (PHP-FPM default port)
            fastcgi_index index.php;
        }
    }
}